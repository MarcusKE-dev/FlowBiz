apply plugin: 'com.android.application'

// ── Version ───────────────────────────────────────────────────────────
// From app/version.properties, overridable per build with
// -PflowbizVersionCode / -PflowbizVersionName (CI).
def versionProps = new Properties()
def versionFile = file('version.properties')
if (versionFile.exists()) versionFile.withInputStream { versionProps.load(it) }
def flowbizVersionCode = (project.findProperty('flowbizVersionCode') ?: versionProps.getProperty('versionCode', '1')).toInteger()
def flowbizVersionName = project.findProperty('flowbizVersionName') ?: versionProps.getProperty('versionName', '1.0.0')

// ── Upload signing ────────────────────────────────────────────────────
// NOTHING SECRET IS COMMITTED. The upload key is read from
// android/keystore.properties (gitignored) or from environment variables,
// in that order. With neither, `bundleRelease` still builds, UNSIGNED, and
// Play Console will refuse it — see docs/ANDROID.md, "Signing".
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) keystorePropsFile.withInputStream { keystoreProps.load(it) }
def signingValue = { String key, String envKey -> keystoreProps.getProperty(key) ?: System.getenv(envKey) }
def uploadStoreFile = signingValue('storeFile', 'FLOWBIZ_UPLOAD_STORE_FILE')
def hasUploadKey = uploadStoreFile && file(uploadStoreFile).exists()

android {
    namespace = "com.abcsystems.flowbiz"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.abcsystems.flowbiz"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode flowbizVersionCode
        versionName flowbizVersionName
        // Defined here rather than in strings.xml so the debug build type
        // can override them without a duplicate-resource error.
        resValue "string", "app_name", "FlowBiz"
        resValue "string", "title_activity_main", "FlowBiz"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasUploadKey) {
            upload {
                storeFile file(uploadStoreFile)
                storePassword signingValue('storePassword', 'FLOWBIZ_UPLOAD_STORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'FLOWBIZ_UPLOAD_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'FLOWBIZ_UPLOAD_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            // Installs beside the Play build, so a developer can keep both.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            resValue "string", "app_name", "FlowBiz Debug"
            resValue "string", "title_activity_main", "FlowBiz Debug"
        }
        release {
            // R8 is left off deliberately: FlowBiz is a WebView app whose
            // size is its web bundle and ML Kit model, and shrinking the
            // plugin bridge buys little and risks stripping classes the
            // bridge reaches by reflection.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasUploadKey) signingConfig signingConfigs.upload
            // Play needs native debug symbols for crash reports from ML Kit.
            ndk { debugSymbolLevel 'SYMBOL_TABLE' }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        resValues true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Google Play Billing, for the in-app FlowBizBilling plugin
    // (app/src/main/java/com/abcsystems/flowbiz/billing/).
    implementation "com.android.billingclient:billing:$playBillingVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
